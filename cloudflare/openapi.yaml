    "/v1/sessions/{session_id}/frames": {
      "parameters": [
        {
          "name": "session_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "pattern": "^[a-zA-Z0-9-]{1,80}$"
          }
        }
      ],
      "post": {
        "operationId": "submitFrame",
        "description": "同一セッションで1画像ずつ送信。next_capture_after_msに従う。観測間隔2500ms超は保持進捗リセット。陽性画像で5000msを確認後に通知。画像自体は永続保存しない。 通知後のクールダウンはなく、次の新しい陽性画像から新たな5秒の確認を始める。",
        "parameters": [
          {
            "name": "X-Frame-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-zA-Z0-9_.:-]{1,128}$"
            },
            "description": "セッション内で一意。受理済みIDの再送は通知しない。"
          }
        ],
        "requestBody": {
          "required": true,
          "description": "生画像バイト列。最大1048576バイト。multipart/JSON/Base64不可。",
          "content": {
            "image/jpeg": {
              "schema": {
                "type": "string",
                "format": "binary"
              }
            },
            "image/png": {
              "schema": {
                "type": "string",
                "format": "binary"
              }
            }
          }
        },
