  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "description": "FOCUS_API_TOKEN。共有デモトークン。"
      }
    },
    "schemas": {
      "Snapshot": {
        "type": "object",
        "required": [
          "session_id",
          "state",
          "notify",
          "notification_id",
          "message",
          "phone_probability",
          "observable_probability",
          "consecutive_count",
          "continuous_hold_ms",
          "required_hold_ms",
          "cooldown_remaining_ms",
          "next_capture_after_ms",
          "provider",
          "reason"
        ],
        "properties": {
          "session_id": {
            "type": "string"
          },
          "state": {
            "type": "string",
            "enum": [
              "observing",
              "suspected",
              "cooldown",
              "unknown",
              "paused",
              "ended"
            ],
            "description": "既定では通知応答もobserving。cooldownは待機を設定したサーバーとの互換用。"
          },
          "notify": {
            "type": "boolean",
            "description": "新しいframes応答でtrueの場合だけ通知を一度実行。GET/controlはfalse。"
          },
          "notification_id": {
            "type": [
              "string",
              "null"
            ]
          },
          "message": {
            "type": [
              "string",
              "null"
            ]
          },
          "phone_probability": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0,
            "maximum": 1
          },
          "observable_probability": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0,
            "maximum": 1
          },
          "provider": {
            "type": "string",
            "enum": [
              "mock",
              "openai"
            ]
          },
          "reason": {
            "type": "string",
            "description": "状態の補足理由。通知条件として使わない。再起動中断はdecision_interrupted。"
          },
          "consecutive_count": {
            "type": "integer",
            "minimum": 0
          },
          "continuous_hold_ms": {
            "type": "integer",
            "minimum": 0,
            "description": "陽性画像の受理時刻による確認済み継続時間。通知応答は達成時間を返し、次の新しい陽性画像から新たな5秒の確認を始める。GETや端末タイマーでは増えない。"
          },
          "required_hold_ms": {
            "type": "integer",
            "minimum": 0,
            "const": 5000
          },
          "cooldown_remaining_ms": {
            "type": "integer",
            "minimum": 0,
            "description": "互換用の通知抑制残り時間。既定では常に0。"
          },
          "next_capture_after_ms": {
            "type": "integer",
            "minimum": 0,
            "description": "次の撮影まで待つ時間。通知後も通常の撮影間隔を返す。paused/endedでは撮影しない。"
          }
        }
      },
      "Error": {
        "type": "object",
        "required": [
          "error",
          "request_id"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              }
            }
          },
          "request_id": {
            "type": "string"
          }
        }
      }
    }
  }
